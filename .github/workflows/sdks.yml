name: sdks

on:
  push:
    branches: [main]
    paths: ["sdks/**", "spec/**", "demos/java/**", ".github/workflows/sdks.yml"]
  pull_request:
    paths: ["sdks/**", "spec/**", "demos/java/**", ".github/workflows/sdks.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendored schemas match spec/
        run: node sdks/scripts/sync-schemas.mjs --check
      - name: The old protocol name does not appear
        run: |
          if git grep -n -i -w -e "h[c]p"; then
            echo "The protocol is called HITLP; remove the old name." >&2
            exit 1
          fi

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test,mcp]'
      - run: pytest

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test the SDK
        working-directory: sdks/java
        run: ./gradlew build
      - name: Demo smoke tests
        working-directory: demos/java
        run: ./gradlew test
